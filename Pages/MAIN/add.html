<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADD PAGE</title>
  <link rel="stylesheet" href="add.css">
</head>

<body>


  <div class="container">


    <div class="imageArea">

      <div class="imageBox">

        <input type="file" accept="image/*" id="imageFile" hidden>
        <label for="imageFile">
          <img src="../../icons/UPLOAD.png" id="picture">

        </label>
      </div>

    </div>



    <div class="name">

      <input type="text" placeholder="Enter The Name">

    </div>


    <div class="description">
      <textarea autocomplete="off" placeholder="Enter Description" spellcheck="false"></textarea>
    </div>

    <button type="submit">SUBMIT</button>
  </div>

  <script src="add.js"></script>
</body>

</html>
