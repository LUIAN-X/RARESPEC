<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RareSpecs</title>
  <link rel="icon" type="image/png" href="../../../images/HOME/favicon.png">
  <link rel="stylesheet" href="add.css">
</head>

<body>




  <div class="goBack">
    <button id="back">
      <img src="../../../icons/Back.png">
      <h5 id="textToShow">GO BACK</h5>
    </button>

  </div>

   <div class="container">
    <div class="imageArea">
      <div class="imageBox">
        <input type="file" accept="image/*" id="imageFile" hidden>
        <label for="imageFile">
          <img id="picture">

        </label>

      </div>


    </div>


    <div class="name">
      <input type="text" placeholder="Enter The Name" id="name" autocomplete="off">
    </div>


    <div class="description">
      <textarea autocomplete="off" placeholder="Enter Description" spellcheck="false" id="comment"></textarea>
    </div>

    <div class="buttons">
      <button class="submit" id="submit">SUBMIT</button>
    </div>
  </div>

 



  <script src="add.js"></script>
</body>

</html>
